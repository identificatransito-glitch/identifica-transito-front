# Include inside the frontend HTTPS server block, which already defines root.
# Native expires preserves inherited security headers and leaves asset caching alone.
location = /auth/register/ {
    try_files /auth/register/index.html =404;
    expires -1;
}

location = /auth/login/ {
    try_files /auth/login/index.html =404;
    expires -1;
}

location = /auth/forgot-password/ {
    try_files /auth/forgot-password/index.html =404;
    expires -1;
}
