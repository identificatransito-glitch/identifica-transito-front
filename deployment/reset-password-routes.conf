# Include inside the frontend HTTPS server block.
# Old e-mails keep their token/email query, on the canonical HTTPS origin.
location = /aprovacao/auth/reset-password {
    return 302 https://www.identificatransito.com.br/auth/reset-password/$is_args$args;
}
location = /aprovacao/auth/reset-password/ {
    return 302 https://www.identificatransito.com.br/auth/reset-password/$is_args$args;
}
location = /auth/reset-password {
    return 302 https://www.identificatransito.com.br/auth/reset-password/$is_args$args;
}
location = /auth/reset-password/ {
    try_files /auth/reset-password/index.html =404;
    expires -1;
}
