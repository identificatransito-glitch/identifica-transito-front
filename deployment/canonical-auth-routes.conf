# Include in the frontend HTTPS server alongside auth-html-cache.conf.
# Explicit HTTPS avoids an HTTP redirect from the port-8080 directory handler.
# Query parameters are preserved; no token or credential belongs in this file.
location = /auth/register {
    return 302 https://www.identificatransito.com.br/auth/register/$is_args$args;
}
location = /auth/login {
    return 302 https://www.identificatransito.com.br/auth/login/$is_args$args;
}
location = /auth/forgot-password {
    return 302 https://www.identificatransito.com.br/auth/forgot-password/$is_args$args;
}
# Inside the existing location / replace proxy_redirect off with:
# proxy_redirect http://www.identificatransito.com.br/ https://www.identificatransito.com.br/;
# Keep inherited security headers, MIME types, and immutable-asset cache rules.
